<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>网站维护中 - Bio-Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #1a2b3c;
            padding: 24px;
        }
        .maintenance {
            max-width: 520px;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            padding: 48px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0066cc;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 16px;
        }
        p {
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: 12px;
        }
        .contact {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="maintenance">
        <div class="logo">Bio-Chain</div>
        <h1>网站已暂停服务</h1>
        <p>我们正在进行网站维护，暂时无法访问。</p>
        <p>给您带来不便，敬请谅解。</p>
        <div class="contact">
            <p>如有紧急需求，请联系：</p>
            <p>电话：+86 21 5049 8599 / +86 188 1828 0286</p>
            <p>邮箱：tony.gu@bio-chain.cn</p>
        </div>
    </main>
</body>
</html>
